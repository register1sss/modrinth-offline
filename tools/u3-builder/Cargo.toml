[package]
name = "u3drinth-builder"
version = "1.0.0"
edition = "2021"
description = "Builds the U3drinth Windows installer from its source"
publish = false

# Its own workspace: not a member of the launcher's.
[workspace]

[[bin]]
name = "U3drinthBuilder"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
native-tls = "0.2"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
