name: U3drinth Windows installer
on:
  push:
    branches: [u3drinth/windows-installer]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    name: Test and build Windows x64 NSIS
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild
      - name: Frontend regression tests
        run: pnpm --filter @modrinth/app-frontend test
      - name: Native launcher regression tests
        run: cargo test -p theseus --lib --locked --release
      - name: Build Windows installer
        working-directory: apps/app
        run: pnpm exec tauri build --bundles nsis
      - name: Write installer checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem target/release/bundle/nsis/*-setup.exe
          if (-not $files) { throw 'NSIS installer was not produced' }
          $files | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content target/release/bundle/nsis/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: U3drinth-Windows-x64-installer
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
